<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI Programme Board — MTN Group Fintech</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0b0d1a;
  --surface:  #10132a;
  --s2:       #151830;
  --s3:       #1b1f38;
  --s4:       #20253f;
  --border:   rgba(255,255,255,.07);
  --b2:       rgba(255,255,255,.13);
  --t1:       #eaecff;
  --t2:       #8b93c4;
  --t3:       #515a85;
  --col-w:    440px;
  --c-bl:     #555e8a;
  --c-ip:     #fdab3d;
  --c-ir:     #a78bfa;
  --c-dn:     #00c875;
  --rainbow:  linear-gradient(90deg,#03fafa 0%,#9878f1 50%,#6161ff 100%);
}
html,body{height:100%;overflow:hidden;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t1);}

/* ── Cursor glow ── */
#cg{position:fixed;width:380px;height:380px;border-radius:50%;pointer-events:none;z-index:9999;top:0;left:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(3,250,250,.06) 0%,rgba(152,120,241,.04) 35%,transparent 70%);opacity:0;transition:opacity .4s;will-change:left,top;}
.ripple{position:fixed;width:100px;height:100px;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(3,250,250,.28),rgba(152,120,241,.18),transparent 70%);animation:rpl 600ms linear forwards;}
@keyframes rpl{0%{transform:translate(-50%,-50%) scale(0);opacity:1;filter:blur(0);}100%{transform:translate(-50%,-50%) scale(4.5);opacity:0;filter:blur(12px);}}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;background:rgba(11,13,26,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:14px;}
.hdr-gem{width:28px;height:28px;border-radius:8px;background:var(--rainbow);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 12px rgba(3,250,250,.22);flex-shrink:0;}
.hdr-brand{font-size:13px;font-weight:800;letter-spacing:.02em;}
.hdr-sub{font-size:10px;color:var(--t3);font-weight:500;}
.hdr-sep{width:1px;height:22px;background:var(--b2);}
.hdr-title{font-size:14px;font-weight:700;background:var(--rainbow);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr-space{flex:1;}
.view-tog{display:flex;gap:2px;background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:3px;}
.vbtn{background:none;border:none;cursor:pointer;padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--t2);transition:all .15s;display:flex;align-items:center;gap:5px;font-family:inherit;}
.vbtn.active{background:var(--s2);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.5);}
.vbtn:hover:not(.active){color:var(--t1);}
.back{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;background:var(--s3);border:1px solid var(--border);color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .15s;flex-shrink:0;position:relative;z-index:101;}
.back:hover{color:var(--t1);border-color:var(--b2);}

/* ── Sub-header ── */
.sub{padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500;padding:5px 11px;border-radius:20px;background:var(--s3);border:1px solid var(--border);cursor:pointer;transition:all .15s;user-select:none;}
.pill:hover{border-color:var(--b2);color:var(--t1);}
.pill.active{border-color:rgba(3,250,250,.4);color:#03fafa;background:rgba(3,250,250,.08);}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pval{font-weight:800;color:var(--t1);}
.sub-sep{flex:1;min-width:20px;}
.srch{display:flex;align-items:center;gap:8px;background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:6px 12px;transition:border-color .15s;}
.srch:focus-within{border-color:rgba(3,250,250,.3);}
.srch input{background:none;border:none;outline:none;color:var(--t1);font-size:12px;width:200px;font-family:inherit;}
.srch input::placeholder{color:var(--t3);}

/* ── Kanban ── */
.board{padding:20px 24px 20px;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;height:calc(100vh - 110px);align-items:flex-start;box-sizing:border-box;}
.board::-webkit-scrollbar{height:6px;}
.board::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:3px;}
.board::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px;}

.col{flex-shrink:0;width:var(--col-w);background:var(--s2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;height:100%;transition:border-color .2s;}
.col::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.col{position:relative;}
.col-bl::before{background:var(--c-bl);}
.col-ip::before{background:linear-gradient(90deg,#fdab3d,#f97316);}
.col-ir::before{background:linear-gradient(90deg,#a78bfa,#818cf8);}
.col-dn::before{background:linear-gradient(90deg,#00c875,#00a86b);}
.col.drag-on{border-color:rgba(3,250,250,.35);background:rgba(3,250,250,.03);}

.col-hdr{padding:14px 16px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--s2);border-radius:14px 14px 0 0;z-index:2;}
.col-ico{font-size:15px;line-height:1;}
.col-ttl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
.col-cnt{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--t2);min-width:24px;text-align:center;}
.col-bl .col-ttl{color:var(--c-bl);} .col-ip .col-ttl{color:var(--c-ip);} .col-ir .col-ttl{color:var(--c-ir);} .col-dn .col-ttl{color:var(--c-dn);}

.col-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;}
.col-body::-webkit-scrollbar{width:4px;}
.col-body::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}

/* ── Card ── */
.card{
  background:#222548;
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;padding:16px 16px 13px;
  cursor:pointer;transition:transform .15s,box-shadow .18s,border-color .15s,background .15s;
  position:relative;overflow:hidden;user-select:none;
  flex-shrink:0;
}
.card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;border-radius:12px 0 0 12px;}
.card.s-bl::before{background:var(--c-bl);}
.card.s-ip::before{background:linear-gradient(180deg,#fdab3d,#f97316);}
.card.s-ir::before{background:linear-gradient(180deg,#a78bfa,#818cf8);}
.card.s-dn::before{background:linear-gradient(180deg,#00c875,#00a86b);}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.6);border-color:rgba(255,255,255,.18);background:#272b54;}
.card.drag-ov{border-color:rgba(3,250,250,.5);background:rgba(3,250,250,.08);}

/* Card header row */
.card-top{display:flex;align-items:flex-start;gap:8px;padding-left:8px;margin-bottom:8px;}
.uc-badge{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.12);color:#b8bde8;border:1px solid rgba(255,255,255,.1);white-space:nowrap;margin-top:2px;}
.card-title{font-size:14px;font-weight:700;color:#ffffff;line-height:1.45;flex:1;word-break:break-word;}
.pri-badge{flex-shrink:0;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:2px;}
.pri-badge.p1{background:rgba(239,68,68,.25);color:#f87171;border:1px solid rgba(239,68,68,.35);}
.pri-badge.p2{background:rgba(249,115,22,.25);color:#fb923c;border:1px solid rgba(249,115,22,.35);}
.pri-badge.p3{background:rgba(253,171,61,.22);color:#fbbf24;border:1px solid rgba(253,171,61,.32);}
.pri-badge.p4{background:rgba(96,165,250,.22);color:#7dd3fc;border:1px solid rgba(96,165,250,.32);}
.pri-badge.p5{background:rgba(139,147,196,.18);color:#a5b4d4;border:1px solid rgba(139,147,196,.28);}

/* Description */
.card-desc{padding-left:8px;font-size:12px;color:#9ca8d8;line-height:1.6;margin-bottom:10px;}

/* Category tag */
.card-cat{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#7a83b0;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);margin-left:8px;margin-bottom:10px;}

/* Assignee row */
.card-footer{display:flex;align-items:center;gap:10px;padding:9px 8px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:2px;}
.assignee-row{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.av{width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.15);}
.assignee-name{font-size:11.5px;color:#c5caef;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pct-label{font-size:11.5px;font-weight:800;color:#c5caef;flex-shrink:0;}
.artifacts-count{font-size:10px;color:#7a83b0;display:flex;align-items:center;gap:3px;flex-shrink:0;}

/* Progress bar */
.prog{margin-top:9px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}

/* Owner·Builder highlights */
.card.ob::before{background:linear-gradient(180deg,#03fafa,#9878f1,#6161ff)!important;}
.card.ob{border-color:rgba(3,250,250,.18);}
.ob-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.02em;
  padding:3px 10px 3px 8px;border-radius:20px;margin:0 8px 10px;
  background:linear-gradient(90deg,rgba(3,250,250,.1),rgba(152,120,241,.1));
  border:1px solid rgba(3,250,250,.22);color:#03fafa;width:fit-content;}
.builder-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:10px;margin-left:7px;white-space:nowrap;
  background:linear-gradient(90deg,rgba(3,250,250,.1),rgba(152,120,241,.1));
  border:1px solid rgba(3,250,250,.2);color:#03fafa;}
.dwr-ob-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.02em;
  padding:5px 12px;border-radius:20px;
  background:linear-gradient(90deg,rgba(3,250,250,.1),rgba(152,120,241,.1));
  border:1px solid rgba(3,250,250,.25);color:#03fafa;}

/* Column footer */
.col-foot{padding:8px 10px;border-top:1px solid var(--border);}
.add-btn{width:100%;background:none;border:1px dashed rgba(255,255,255,.1);color:var(--t3);font-size:11px;padding:7px;border-radius:8px;cursor:pointer;transition:all .15s;font-family:inherit;}
.add-btn:hover{border-color:var(--b2);color:var(--t2);background:var(--s4);}

.col-empty{padding:30px 12px;text-align:center;color:var(--t3);font-size:11px;}
.col-empty-ico{font-size:28px;margin-bottom:8px;opacity:.4;}

/* ── Table view ── */
.tbl-wrap{padding:0 24px 50px;display:none;}
.btbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:0;}
.btbl thead{position:sticky;top:56px;z-index:5;}
.btbl thead th{
  padding:13px 16px;background:var(--s2);color:var(--t3);font-weight:700;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid rgba(255,255,255,.08);
  border-top:1px solid var(--border);text-align:left;cursor:pointer;user-select:none;white-space:nowrap;
  transition:color .15s;
}
.btbl thead th:hover{color:var(--t1);}
.btbl thead th:first-child{border-radius:10px 0 0 0;}
.btbl thead th:last-child{border-radius:0 10px 0 0;}
.si{opacity:.4;font-size:10px;margin-left:3px;}
.sorted .si{opacity:1;color:#03fafa;}
.btbl tbody tr{border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .12s;}
.btbl tbody tr:hover{background:rgba(255,255,255,.03);}
.btbl tbody tr:hover .td-name{color:#fff;}
.btbl td{padding:14px 16px;vertical-align:middle;}
.td-id{color:var(--t3);font-size:11px;font-weight:800;width:60px;white-space:nowrap;letter-spacing:.03em;}
.td-name{font-weight:600;color:var(--t1);min-width:260px;max-width:400px;}
.td-name .n-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:4px;}
.td-name .n-desc{font-size:11px;color:var(--t3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px;line-height:1.4;}
.td-assignee{white-space:nowrap;width:180px;}
.td-asn-inner{display:flex;align-items:center;gap:8px;}
.td-lead{color:var(--t2);font-size:12px;white-space:nowrap;width:140px;}
.td-lead-inner{display:flex;align-items:center;gap:7px;}
.td-av{width:26px;height:26px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.1);}
.td-av-name{font-size:12px;font-weight:600;color:var(--t2);}
.td-status{width:130px;}
.td-progress{width:160px;}
.schip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.schip.s-ns{background:rgba(85,94,138,.18);color:var(--c-bl);border:1px solid rgba(85,94,138,.2);}
.schip.s-ip{background:rgba(253,171,61,.14);color:var(--c-ip);border:1px solid rgba(253,171,61,.2);}
.schip.s-ir{background:rgba(167,139,250,.14);color:var(--c-ir);border:1px solid rgba(167,139,250,.2);}
.schip.s-dn{background:rgba(0,200,117,.14);color:var(--c-dn);border:1px solid rgba(0,200,117,.2);}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.pct-wrap{display:flex;align-items:center;gap:9px;}
.pct-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;min-width:80px;}
.pct-fill{height:100%;border-radius:3px;transition:width .4s;}
.pct-lbl{font-size:11px;color:var(--t2);font-weight:700;min-width:34px;text-align:right;}
.grp-hdr td{
  padding:18px 16px 8px;font-size:11px;font-weight:800;color:var(--t2);
  text-transform:uppercase;letter-spacing:.07em;background:var(--bg);
  border-bottom:1px solid rgba(255,255,255,.05)!important;
}
.grp-hdr-inner{display:inline-flex;align-items:center;gap:10px;}
.grp-cnt{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--t3);font-weight:700;}

/* ── Detail drawer (slides in from right) ── */
.drawer-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--s2);border-left:1px solid var(--b2);z-index:401;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.drawer.open{transform:translateX(0);}
.drawer-glow{position:absolute;top:-100px;right:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(3,250,250,.05) 0%,rgba(152,120,241,.03) 50%,transparent 70%);pointer-events:none;}

/* Drawer header */
.dwr-hdr{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;flex-shrink:0;}
.dwr-uc{font-size:10px;font-weight:800;color:var(--t3);padding:3px 8px;background:var(--s3);border-radius:5px;flex-shrink:0;margin-top:3px;letter-spacing:.05em;}
.dwr-title{font-size:16px;font-weight:800;color:var(--t1);flex:1;line-height:1.4;}
.dwr-close{background:none;border:none;color:var(--t3);cursor:pointer;font-size:20px;padding:4px 6px;border-radius:6px;flex-shrink:0;transition:color .15s,background .15s;line-height:1;font-family:inherit;}
.dwr-close:hover{color:var(--t1);background:var(--s4);}

/* Drawer body */
.dwr-body{padding:0 22px 24px;overflow-y:auto;flex:1;}
.dwr-body::-webkit-scrollbar{width:4px;}
.dwr-body::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}

/* Status bar row */
.dwr-statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0 16px;border-bottom:1px solid var(--border);}

/* Section */
.dwr-section{margin-top:18px;}
.dwr-sec-title{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.dwr-sec-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* Description box */
.desc-box{font-size:13px;color:var(--t2);line-height:1.7;padding:12px 14px;background:var(--s3);border-radius:10px;border:1px solid var(--border);}

/* Progress section */
.prog-big{margin-top:10px;}
.prog-big-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px;}
.prog-big-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.prog-pct-row{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:5px;}

/* Meta grid */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.meta-item{background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.meta-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.meta-val{font-size:13px;color:var(--t1);font-weight:600;display:flex;align-items:center;gap:7px;}

/* Assignee block */
.assignee-block{display:flex;align-items:center;gap:10px;background:var(--s3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.av-lg{width:36px;height:36px;border-radius:50%;font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.1);}
.av-name{font-size:13px;font-weight:700;color:var(--t1);}
.av-role{font-size:11px;color:var(--t3);margin-top:2px;}

/* Artifacts */
.artifacts-list{display:flex;flex-direction:column;gap:7px;}
.artifact-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--s3);border:1px solid var(--border);border-radius:9px;text-decoration:none;transition:border-color .15s,background .15s;cursor:pointer;}
.artifact-row:hover{border-color:rgba(3,250,250,.3);background:rgba(3,250,250,.04);}
.art-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.art-label{font-size:12.5px;font-weight:600;color:var(--t1);flex:1;}
.art-type{font-size:10px;color:var(--t3);margin-top:1px;}
.art-arrow{color:var(--t3);font-size:14px;flex-shrink:0;}
.artifact-row:hover .art-arrow{color:var(--t1);}

/* Next steps */
.nextsteps-box{font-size:12.5px;color:var(--t2);line-height:1.7;padding:12px 14px;background:var(--s3);border-radius:10px;border:1px solid var(--border);white-space:pre-wrap;}

/* Business value */
.bv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.bv-item{background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:10px 13px;}
.bv-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.bv-val{font-size:12.5px;color:var(--t1);font-weight:600;}
.bv-impact-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.bv-impact-item{display:flex;gap:8px;font-size:12px;color:var(--t2);line-height:1.5;}
.bv-impact-item::before{content:'›';color:var(--c-ir);font-weight:700;flex-shrink:0;}

/* Open in tracker CTA */

function oMeta(n){ if(!n) return {bg:'linear-gradient(135deg,#6366f1,#818cf8)',init:'?'}; const f=n.split(' ')[0]; return OWNER_META[n]||OWNER_META[f]||{bg:'linear-gradient(135deg,#6366f1,#818cf8)',init:(n[0]||'?').toUpperCase()}; }

function ucCat(r){
  const id=r.id;
  if(id>=1&&id<=12) return {label:'Quality Engineering',icon:'🧪'};
  if(id===13)       return {label:'CI/CD',icon:'⚙️'};
  if(id===14)       return {label:'Delivery Mgmt',icon:'📦'};
  if(id>=15&&id<=16)return {label:'Fraud & Copilot',icon:'🛡️'};
  if(id>=17&&id<=19)return {label:'AIOps / Voice',icon:'🔊'};
  if(id>=20&&id<=24)return {label:'Security & Intel',icon:'🔐'};
  if(id>=25&&id<=30)return {label:'USSD Stack',icon:'📟'};
  if(id>=31&&id<=36)return {label:'MoMo Consumer',icon:'💳'};
  if(id>=37&&id<=38)return {label:'MoMo Merchant',icon:'🏪'};
  return {label:'General',icon:'🗂️'};
}

let data=[], activeFilter='all', sortCol='id', sortAsc=true, dragId=null;

function loadData(){
  try{ const s=localStorage.getItem(STORE_KEY); if(s){const p=JSON.parse(s);data=p.data||[];} }catch(e){}
  if(!data.length){
    const ks=Object.keys(localStorage).filter(k=>k.startsWith('fintech_projects_v')).sort().reverse();
    for(const k of ks){ try{const p=JSON.parse(localStorage.getItem(k));if(p&&p.data&&p.data.length){data=p.data;break;}}catch(e){} }
  }
  if(!data.length || data.length < INITIAL_DATA.length){
    data=JSON.parse(JSON.stringify(INITIAL_DATA));
    try{ localStorage.setItem(STORE_KEY,JSON.stringify({data,nextId:39})); }catch(e){}
  }
}
function saveData(){
  try{ const s=localStorage.getItem(STORE_KEY); const p=s?JSON.parse(s):{}; p.data=data; localStorage.setItem(STORE_KEY,JSON.stringify(p)); }catch(e){}
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function priCls(p){ return 'p'+(p||5); }
function progColor(pct,s){ if(s==='Done') return '#00c875'; if(s==='In progress') return '#fdab3d'; if(s==='In review') return '#a78bfa'; return '#555e8a'; }
function sCls(s){ if(s==='Done') return 's-dn'; if(s==='In progress') return 's-ip'; if(s==='In review') return 's-ir'; return 's-bl'; }
function sKls(s){ if(s==='Done') return 's-dn'; if(s==='In progress') return 's-ip'; if(s==='In review') return 's-ir'; return 's-bl'; }
function getAssignee(r){ return r.status==='In progress' ? MALCOLM : (r.assignedTo||r.owner||MALCOLM); }
function isOB(r){ return (r.owner||'').toLowerCase().includes('malcolm'); }

function getFiltered(){
  const q=(document.getElementById('srchInput').value||'').toLowerCase().trim();
  return data.filter(r=>{
    const mf=activeFilter==='all'||r.status===activeFilter;
    const mq=!q||r.project.toLowerCase().includes(q)||(r.owner||'').toLowerCase().includes(q)||String(r.id).includes(q);
    return mf&&mq;
  });
}

function updateStats(){
  const ns=data.filter(r=>r.status==='Not started').length;
  const ip=data.filter(r=>r.status==='In progress').length;
  const ir=data.filter(r=>r.status==='In review').length;
  const dn=data.filter(r=>r.status==='Done').length;
  document.getElementById('cnt-all').textContent=data.length;
  document.getElementById('cnt-ns').textContent=ns;
  document.getElementById('cnt-ip').textContent=ip;
  document.getElementById('cnt-ir').textContent=ir;
  document.getElementById('cnt-dn').textContent=dn;
}

function renderKanban(){
  const filtered=getFiltered();
  const cols={'Not started':{el:'cards-ns',cnt:'cc-ns'},'In progress':{el:'cards-ip',cnt:'cc-ip'},'In review':{el:'cards-ir',cnt:'cc-ir'},'Done':{el:'cards-dn',cnt:'cc-dn'}};
  const icons={'Not started':'📋','In progress':'🚀','In review':'🔍','Done':'✅'};
  Object.entries(cols).forEach(([status,cfg])=>{
    const rows=filtered.filter(r=>r.status===status);
    document.getElementById(cfg.cnt).textContent=rows.length;
    const el=document.getElementById(cfg.el);
    if(!rows.length){ el.innerHTML=`<div class="col-empty"><div class="col-empty-ico">${icons[status]}</div>No items here</div>`; return; }
    el.innerHTML=rows.map(r=>{
      const color=progColor(r.pct,r.status);
      const assignee=getAssignee(r);
      const ob=isOB(r);
      const om=oMeta(assignee);
      const cat=ucCat(r);
      const artCount=(r.artifacts||[]).length;
      const descShort=(r.desc||'').replace(/\[.*?\]/g,'').trim();
      return `<div class="card ${sKls(r.status)}${ob?' ob':''}" draggable="true" data-id="${r.id}"
        ondragstart="onDS(event,${r.id})" onclick="openDrawer(${r.id})">
        <div class="card-top">
          <span class="uc-badge">UC-${r.id}</span>
          <span class="card-title">${esc(r.project)}</span>
          <span class="pri-badge ${priCls(r.priority)}">P${r.priority}</span>
        </div>
        ${descShort ? `<div class="card-desc">${esc(descShort)}</div>` : ''}
        ${ob ? '<div class="ob-chip"><span>⚡</span>Owner · Builder</div>' : ''}
        <span class="card-cat">${cat.icon} ${esc(cat.label)}</span>
        <div class="card-footer">
          <div class="assignee-row">
            <span class="av" style="background:${om.bg}">${om.init}</span>
            <span class="assignee-name">${esc(assignee)}</span>
          </div>
          ${artCount ? `<span class="artifacts-count">📎 ${artCount}</span>` : ''}
          <span class="pct-label">${r.pct}%</span>
        </div>
        <div class="prog"><div class="prog-fill" style="width:${r.pct}%;background:${color}"></div></div>
      </div>`;
    }).join('');
  });
}

function renderTable(){
  const filtered=[...getFiltered()].sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    return sortAsc?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);
  });
  const groups={};
  filtered.forEach(r=>{ const g=r.owner||'Unassigned'; if(!groups[g])groups[g]=[]; groups[g].push(r); });
  let html='';
  Object.entries(groups).forEach(([owner,rows])=>{
    const om=oMeta(owner);
    html+=`<tr class="grp-hdr"><td colspan="7">
      <div class="grp-hdr-inner">
        <span style="width:26px;height:26px;border-radius:50%;background:${om.bg};display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.1);">${om.init}</span>
        <span style="color:var(--t2)">${esc(owner)}</span>
        <span class="grp-cnt">${rows.length} use cases</span>
      </div>
    </td></tr>`;

      const color=progColor(r.pct,r.status);

      const sLabel=r.status==='Not started'?'Backlog':r.status;
      const sDot={'Done':'#00c875','In progress':'#fdab3d','In review':'#a78bfa'}[r.status]||'#555e8a';
      const assignee=getAssignee(r);
      const ob=isOB(r);
      const aom=oMeta(assignee);
      const oom=oMeta(r.owner);
      const cat=ucCat(r);
      const descClean=(r.desc||'').replace(/\[.*?\]/g,'').trim().slice(0,90);
      const artCount=(r.artifacts||[]).length;
      html+=`<tr onclick="openDrawer(${r.id})">

        <td class="td-name">
          <div class="n-title">${esc(r.project)}</div>
          ${descClean?`<div class="n-desc">${esc(descClean)}${(r.desc||'').length>90?'…':''}</div>`:''}
          <div style="margin-top:5px;display:flex;align-items:center;gap:6px;">
            <span class="card-cat" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:var(--t3);display:inline-flex;align-items:center;gap:3px;">${cat.icon} ${esc(cat.label)}</span>
            ${artCount?`<span style="font-size:10px;color:var(--t3);">📎 ${artCount}</span>`:''}
          </div>
        </td>
        <td><span class="pri-badge ${priCls(r.priority)}" style="font-size:10px;padding:3px 7px;">P${r.priority}</span></td>
        <td class="td-lead">
          <div class="td-lead-inner">
            <span class="td-av" style="background:${oom.bg}">${oom.init}</span>
            <span class="td-av-name">${esc((r.owner||'').split(' ')[0])}</span>
          </div>
        </td>
        <td class="td-assignee">
          <div class="td-asn-inner" style="flex-wrap:wrap;gap:6px;">
            <span class="td-av" style="background:${aom.bg};width:28px;height:28px;">${aom.init}</span>
            <span style="font-size:12px;font-weight:600;color:var(--t1);">${esc(assignee)}</span>
            ${ob?`<span class="builder-pill">⚡ Builder</span>`:''}
          </div>
        </td>
        <td class="td-status"><span class="schip ${sc}"><span class="sdot" style="background:${sDot}"></span>${esc(sLabel)}</span></td>

        </td>
      </tr>`;
    });
  });
  document.getElementById('tblBody').innerHTML=html;
}

      <div class="artifacts-list">
        ${artifacts.map(a=>{
          const am=artMeta(a.t);
          return `<a class="artifact-row" href="${esc(a.u)}" target="_blank" rel="noopener">
            <span class="art-icon" style="background:${am.bg}">${am.icon}</span>
            <span><div class="art-label">${esc(a.l)}</div><div class="art-type" style="color:${am.color}">${am.lbl}</div></span>
            <span class="art-arrow">→</span>
          </a>`;
        }).join('')}
      </div>
    </div>`;
  }

  let bvHtml='';
  if(bv.tier||bv.value){
    const impacts=(bv.impact||[]).map(i=>`<div class="bv-impact-item">${esc(i)}</div>`).join('');
    bvHtml=`<div class="dwr-section">
      <div class="dwr-sec-title">💰 Business Value</div>
      <div class="bv-grid">
        ${bv.tier?`<div class="bv-item"><div class="bv-label">Value Tier</div><div class="bv-val"><span class="tier-badge tier-${esc(bv.tier)}">${esc(bv.tier)}</span></div></div>`:''}
        ${bv.driver?`<div class="bv-item"><div class="bv-label">Driver</div><div class="bv-val">${esc(bv.driver)}</div></div>`:''}
        ${bv.value?`<div class="bv-item" style="grid-column:1/-1"><div class="bv-label">Estimated Value</div><div class="bv-val" style="color:var(--c-dn);font-size:15px;">${esc(bv.value)}</div></div>`:''}
      </div>
      ${impacts?`<div class="bv-impact-list">${impacts}</div>`:''}
    </div>`;
  }

  let nsHtml='';
  if(r.nextSteps){
    nsHtml=`<div class="dwr-section">
      <div class="dwr-sec-title">⏭️ Next Steps</div>
      <div class="nextsteps-box">${esc(r.nextSteps)}</div>
    </div>`;
  }

  // Build team block separately to avoid triple-nested template literals
  let teamHtml = '';
  if(ob){
    teamHtml = '<div class="assignee-block" style="background:linear-gradient(135deg,rgba(3,250,250,.07),rgba(152,120,241,.07));border-color:rgba(3,250,250,.25);position:relative;overflow:hidden;">'
      + '<span class="av-lg" style="background:' + ownerOm.bg + ';box-shadow:0 0 0 3px rgba(3,250,250,.2);">' + ownerOm.init + '</span>'
      + '<div style="flex:1;"><div class="av-name">' + esc(r.owner||'—') + '</div><div class="av-role" style="color:var(--t3);">Use Case Lead · Builder</div></div>'
      + '<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;background:linear-gradient(90deg,rgba(3,250,250,.12),rgba(152,120,241,.12));border:1px solid rgba(3,250,250,.25);color:#03fafa;flex-shrink:0;">⚡ Building this</span>'
      + '</div>';
  } else {
    teamHtml = '<div class="assignee-block">'
      + '<span class="av-lg" style="background:' + ownerOm.bg + '">' + ownerOm.init + '</span>'
      + '<div><div class="av-name">' + esc(r.owner||'—') + '</div><div class="av-role">Use Case Lead</div></div>'
      + '</div>';
    if(assignee !== r.owner){
      teamHtml += '<div class="assignee-block" style="background:rgba(3,250,250,.04);border-color:rgba(3,250,250,.15);">'
        + '<span class="av-lg" style="background:' + om.bg + '">' + om.init + '</span>'
        + '<div><div class="av-name">' + esc(assignee) + '</div><div class="av-role">Assigned To</div></div>'
        + '</div>';
    }
  }

  const obBadge = ob ? '<span class="dwr-ob-badge">⚡ Owner · Builder</span>' : '';

  document.getElementById('d-body').innerHTML=`
    <div class="dwr-statusbar">
      <span class="schip ${sc}"><span class="sdot" style="background:${sDot}"></span>${sLabel}</span>
      <span class="pri-badge ${priCls(r.priority)}" style="font-size:11px;padding:3px 8px;">P${r.priority} Priority</span>
      <span class="card-cat">${cat.icon} ${cat.label}</span>
      ${obBadge}
    </div>

    <div class="dwr-section">
      <div class="dwr-sec-title">📊 Progress</div>
      <div class="prog-big">
        <div class="prog-big-bar"><div class="prog-big-fill" style="width:${r.pct}%;background:${color}"></div></div>
        <div class="prog-pct-row"><span style="color:${color};font-weight:700;font-size:15px;">${r.pct}%</span><span>${r.pct===100?'Complete':'In progress'}</span></div>
      </div>
    </div>

    <div class="dwr-section">
      <div class="dwr-sec-title">👥 Team</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${teamHtml}</div>
    </div>

    <div class="dwr-section">
      <div class="dwr-sec-title">📋 Description</div>
      <div class="desc-box">${esc(descClean)}</div>
    </div>

    ${artsHtml}
    ${nsHtml}
    ${bvHtml}

    <a class="cta" href="/">Open Full Tracker →</a>
  `;

  document.getElementById('drawerOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('drawer').classList.add('open'),10);
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ESC key
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

// ── Drag & Drop ──────────────────────────────────────────────────
function onDS(e,id){ dragId=id; e.dataTransfer.effectAllowed='move'; }
function onDragOver(e,s){ e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('drag-on'); }
function onDL(e){ e.currentTarget.classList.remove('drag-on'); }
function onDrop(e,s){
  e.preventDefault(); e.currentTarget.classList.remove('drag-on');
  if(dragId===null) return;
  const r=data.find(x=>x.id===dragId);
  if(r){ r.status=s; if(s==='Done') r.pct=100; saveData(); render(); }
  dragId=null;
}

// ── Filter / sort / view ──────────────────────────────────────────
function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  const m={all:'pill-all','Not started':'pill-ns','In progress':'pill-ip','In review':'pill-ir','Done':'pill-dn'};
  document.getElementById(m[f])?.classList.add('active');
  render();
}
function sortBy(col){
  sortAsc=sortCol===col?!sortAsc:true; sortCol=col;
  document.querySelectorAll('.si').forEach(s=>s.textContent='↕');
  const el=document.getElementById(`s-${col}`); if(el) el.textContent=sortAsc?'↑':'↓';
  renderTable();
}
function setView(v){
  document.getElementById('boardView').style.display=v==='kanban'?'flex':'none';
  document.getElementById('tableView').style.display=v==='table'?'block':'none';
  document.getElementById('btnK').classList.toggle('active',v==='kanban');
  document.getElementById('btnT').classList.toggle('active',v==='table');
}
function render(){ updateStats(); renderKanban(); renderTable(); }

loadData();
render();

// ── Cursor glow ───────────────────────────────────────────────────
(function(){
  const g=document.getElementById('cg'); let raf=null,cx=0,cy=0;
  function upd(){g.style.left=cx+'px';g.style.top=cy+'px';raf=null;}
  document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;g.style.opacity='1';if(!raf)raf=requestAnimationFrame(upd);},{passive:true});
  document.addEventListener('mouseleave',()=>{g.style.opacity='0';});
  document.addEventListener('click',e=>{
    const r=document.createElement('div');r.className='ripple';
    r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
    document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
  },{passive:true});
})();
</script>
</body>
</html>
